name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build Project
        run: bun run build
        env:
          NODE_ENV: production

      - name: Prepare Static Artifacts
        run: |
          # Procura a pasta de saída estática gerada pelo TanStack/Vinxi
          if [ -d "./.output/public" ]; then
            PUB_DIR="./.output/public"
          elif [ -d "./dist" ]; then
            PUB_DIR="./dist"
          else
            PUB_DIR="./.output"
          fi

          echo "STATIC_DIR=$PUB_DIR" >> $GITHUB_ENV

          # Garante o roteamento SPA e evita bloqueio de pastas com underline no GH Pages
          cp $PUB_DIR/index.html $PUB_DIR/404.html 2>/dev/null || true
          touch $PUB_DIR/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.STATIC_DIR }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
