name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build Project
        run: bun run build || npx vite build
        env:
          NODE_ENV: production

      - name: Check Output Directory
        run: |
          if [ -d "./dist" ]; then
            echo "BUILD_DIR=./dist" >> $GITHUB_ENV
          elif [ -d "./.output/public" ]; then
            echo "BUILD_DIR=./.output/public" >> $GITHUB_ENV
          elif [ -d "./build" ]; then
            echo "BUILD_DIR=./build" >> $GITHUB_ENV
          else
            echo "Pasta de build nao encontrada!" && exit 1
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.BUILD_DIR }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
