name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build Project
        run: bun run build
        env:
          NODE_ENV: production

      - name: Locate and Prepare Dist Directory
        run: |
          TARGET_DIR=""
          if [ -d "./dist" ]; then
            TARGET_DIR="./dist"
          elif [ -d "./.output/public" ]; then
            TARGET_DIR="./.output/public"
          elif [ -d "./build" ]; then
            TARGET_DIR="./build"
          fi

          if [ -z "$TARGET_DIR" ]; then
            echo "Pasta de build nao encontrada!" && exit 1
          fi

          # Garante a existencia do index.html para SPA no GitHub Pages
          if [ ! -f "$TARGET_DIR/index.html" ] && [ -f "$TARGET_DIR/200.html" ]; then
            cp "$TARGET_DIR/200.html" "$TARGET_DIR/index.html"
          fi

          # Copia index.html para 404.html para suportar rotas de SPA
          if [ -f "$TARGET_DIR/index.html" ]; then
            cp "$TARGET_DIR/index.html" "$TARGET_DIR/404.html"
          fi

          echo "BUILD_DIR=$TARGET_DIR" >> $GITHUB_ENV

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.BUILD_DIR }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
